<title>English Benkyou</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;700&family=Zen+Maru+Gothic:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow app column like a 単語帳 (word-card ring book); cards are the only framed objects. */
:root {
  --bg: #F3F5F1;
  --surface: #FFFFFF;
  --ink: #1D2633;
  --muted: #5E6B7A;
  --line: #DCE2DA;
  --ai: #2D4F8A;        /* 藍 indigo: primary */
  --ai-soft: #E3EAF5;
  --shu: #C8553D;       /* 朱: wrong / streak */
  --shu-soft: #F8E4DE;
  --matcha: #4E7D3A;    /* 抹茶: correct / learned */
  --matcha-soft: #E3EEDB;
  --ring: #B9C2CC;
  --f-en: "Lexend", "Segoe UI", system-ui, sans-serif;
  --f-ja: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #141A22; --surface: #1D2530; --ink: #E7ECF2; --muted: #9AA7B6; --line: #2E3946;
  --ai: #8FB0E6; --ai-soft: #24324A; --shu: #EE8B74; --shu-soft: #3B2724;
  --matcha: #9BCB82; --matcha-soft: #24331F; --ring: #3A4656; color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #141A22; --surface: #1D2530; --ink: #E7ECF2; --muted: #9AA7B6; --line: #2E3946;
  --ai: #8FB0E6; --ai-soft: #24324A; --shu: #EE8B74; --shu-soft: #3B2724;
  --matcha: #9BCB82; --matcha-soft: #24331F; --ring: #3A4656; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-ja); font-size: 16px; line-height: 1.6; }
.app { max-width: 560px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 40px; display: flex; flex-direction: column; gap: 20px; }
.en { font-family: var(--f-en); }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, .unit:focus-visible { outline: 3px solid var(--ai); outline-offset: 2px; }

header.top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.brand { display: flex; align-items: baseline; gap: 8px; }
.brand b { font-family: var(--f-en); font-weight: 700; font-size: 20px; color: var(--ai); letter-spacing: -0.01em; }
.brand span { font-size: 13px; color: var(--muted); }
.iconbtn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 6px 14px; font-size: 14px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.stat .n { font-family: var(--f-en); font-weight: 700; font-size: 24px; font-variant-numeric: tabular-nums; line-height: 1.2; }
.stat .l { font-size: 12px; color: var(--muted); }
.stat.streak .n { color: var(--shu); }
.stat.learned .n { color: var(--matcha); }

h1 { font-size: 22px; margin: 0; text-wrap: balance; }
h2 { font-size: 15px; margin: 0; color: var(--muted); font-weight: 500; letter-spacing: 0.04em; }
.hint { font-size: 14px; color: var(--muted); margin: 0; }

.units { display: flex; flex-direction: column; gap: 10px; }
.unit { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; }
.unit .name { font-weight: 700; font-size: 17px; }
.unit .sub { font-family: var(--f-en); font-size: 13px; color: var(--muted); }
.unit .acts { display: flex; gap: 6px; grid-row: span 2; }
.bar { grid-column: 1 / -1; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--matcha); border-radius: 3px; transition: width .3s; }
.count { grid-column: 1 / -1; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; margin-top: -2px; }

.btn { border: 0; border-radius: 10px; padding: 10px 16px; font-weight: 700; font-size: 15px; background: var(--ai); color: var(--surface); }
.btn.ghost { background: var(--ai-soft); color: var(--ai); }
.btn.big { padding: 14px 18px; font-size: 17px; flex: 1; }
.btn.again { background: var(--shu-soft); color: var(--shu); }
.btn.know { background: var(--matcha); color: var(--surface); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }

.viewhead { display: flex; align-items: center; gap: 12px; }
.viewhead .back { border: 0; background: none; font-size: 15px; color: var(--ai); padding: 6px 0; }
.viewhead .prog { margin-left: auto; font-family: var(--f-en); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }

/* The flashcard: a ring-bound word card */
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; min-height: 300px; padding: 36px 20px 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; gap: 10px; width: 100%; box-shadow: 0 2px 0 var(--line); }
.card::before { content: ""; position: absolute; top: 12px; left: 22px; width: 14px; height: 14px; border-radius: 50%; border: 3px solid var(--ring); background: var(--bg); }
.card .word { font-family: var(--f-en); font-weight: 700; font-size: clamp(34px, 9vw, 52px); line-height: 1.15; overflow-wrap: anywhere; }
.card .word.phrase { font-size: clamp(24px, 6.5vw, 34px); }
.card .visual { font-family: var(--f-en); font-weight: 700; font-size: 44px; color: var(--ai); line-height: 1; }
.card .swatch { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--line); }
.card .meaning { font-size: 26px; font-weight: 700; color: var(--ai); }
.card .ex { font-size: 15px; color: var(--muted); max-width: 40ch; }
.card .ex .en { color: var(--ink); display: block; font-size: 17px; }
.card .tap { font-size: 13px; color: var(--muted); margin-top: 8px; }
.speak { border: 1px solid var(--ai); color: var(--ai); background: var(--ai-soft); border-radius: 999px; padding: 8px 16px; font-size: 15px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; }
.speak svg { width: 18px; height: 18px; }

/* Quiz */
.q { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 24px 20px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.q .kind { font-size: 13px; color: var(--muted); }
.q .prompt { font-size: 30px; font-weight: 700; line-height: 1.25; overflow-wrap: anywhere; }
.q .prompt.en { font-size: clamp(26px, 7vw, 38px); }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
@media (max-width: 420px) { .opts.long { grid-template-columns: 1fr; } }
.opt { border: 2px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px 10px; font-size: 18px; font-weight: 700; min-height: 64px; overflow-wrap: anywhere; }
.opt.en { font-family: var(--f-en); font-weight: 500; }
.opt.right { border-color: var(--matcha); background: var(--matcha-soft); color: var(--matcha); }
.opt.wrong { border-color: var(--shu); background: var(--shu-soft); color: var(--shu); }
.opt:disabled { cursor: default; }
.feedback { min-height: 28px; text-align: center; font-weight: 700; }
.feedback.ok { color: var(--matcha); } .feedback.ng { color: var(--shu); }

.result { text-align: center; display: flex; flex-direction: column; gap: 14px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 28px 20px; }
.result .score { font-family: var(--f-en); font-weight: 700; font-size: 56px; color: var(--ai); font-variant-numeric: tabular-nums; line-height: 1; }
.misses { width: 100%; text-align: left; display: flex; flex-direction: column; gap: 6px; }
.misses div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--line); padding-block: 6px; }

.settings { display: flex; flex-direction: column; gap: 18px; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 20px; }
.settings label { font-weight: 700; display: block; margin-bottom: 6px; }
.seg { display: flex; gap: 6px; flex-wrap: wrap; }
.seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 14px; font-size: 14px; }
.seg button[aria-pressed="true"] { background: var(--ai); border-color: var(--ai); color: var(--surface); }
select { font: inherit; padding: 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); width: 100%; }
.danger { border: 1px solid var(--shu); color: var(--shu); background: none; border-radius: 10px; padding: 8px 14px; font-weight: 700; }
.note { font-size: 13px; color: var(--muted); background: var(--shu-soft); border-radius: 10px; padding: 10px 12px; margin: 0; }
/* ---- Beginner-friendly layer: bigger targets, clearer labels, text-size setting ---- */
.app { zoom: var(--zoom, 1); }
:root[data-size="m"] { --zoom: 1; }
:root[data-size="l"] { --zoom: 1.15; }
:root[data-size="xl"] { --zoom: 1.3; }
body { font-size: 17px; }
.hint { font-size: 15px; }
.brand { flex-direction: column; align-items: flex-start; gap: 0; line-height: 1.2; }
.brand span { font-size: 13px; }
.iconbtn { white-space: nowrap; min-height: 44px; padding: 8px 16px; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; font-weight: 700; color: var(--ai); }
.stat .l { font-size: 13px; }
.btn, .opt, .speak, .danger, .seg button { min-height: 48px; }
.btn { font-size: 16px; }
.btn:active, .opt:active, .speak:active, .iconbtn:active, .back:active { transform: translateY(1px); filter: brightness(0.96); }
.hero { display: flex; flex-direction: column; gap: 12px; }
.start { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 18px 16px; font-size: 21px; border-radius: 14px; box-shadow: 0 3px 0 color-mix(in srgb, var(--ai) 60%, black); }
.start small { font-size: 14px; font-weight: 500; opacity: 0.9; }
.linkbtn { border: 0; background: none; color: var(--ai); font-weight: 700; font-size: 15px; padding: 10px 4px; min-height: 44px; text-decoration: underline; text-underline-offset: 3px; }
.legend { display: flex; flex-direction: column; gap: 4px; font-size: 14px; color: var(--muted); margin: 0; }
.legend b { color: var(--ink); }
.unit .acts .btn { padding: 10px 14px; }
.count { font-size: 13px; }
.unit { grid-template-columns: 1fr; }
.unit .acts { grid-row: auto; gap: 8px; }
.unit .acts .btn { flex: 1; }
h1 { word-break: auto-phrase; }

.viewhead { flex-wrap: wrap; }
.viewhead .back { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 8px 16px; min-height: 44px; font-weight: 700; font-size: 15px; }
.viewhead .prog { font-size: 15px; }
.card .tap { font-size: 14px; }
.reveal { width: 100%; }
.speakrow { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 8px; }
.speak { justify-content: center; }
.feedback { font-size: 19px; display: flex; flex-direction: column; align-items: center; gap: 2px; }
.feedback .mark { font-size: 44px; line-height: 1; font-family: var(--f-en); }
.confirm { background: var(--shu-soft); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; }
.confirm p { margin: 0; font-weight: 700; }
.banner { background: var(--ai-soft); color: var(--ink); border-radius: 14px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; }
.banner b { color: var(--ai); }
.banner .row .btn { flex: 1; }
.help { display: flex; flex-direction: column; gap: 16px; }
.help section { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
.help h2 { color: var(--ai); font-size: 18px; font-weight: 700; letter-spacing: 0; }
.help ol { margin: 0; padding-left: 1.4em; display: flex; flex-direction: column; gap: 10px; }
.help .demo { display: inline-flex; vertical-align: middle; pointer-events: none; min-height: 0; padding: 4px 10px; font-size: 14px; border-radius: 8px; }
.help .demo.speak { border-radius: 999px; }
.help .demo svg { width: 14px; height: 14px; }
.guide-step { display: flex; gap: 12px; align-items: flex-start; }
.guide-step .num { flex: none; width: 34px; height: 34px; border-radius: 50%; background: var(--ai); color: var(--surface); display: grid; place-items: center; font-family: var(--f-en); font-weight: 700; }
details.more { border-top: 1px solid var(--line); padding-top: 14px; }
details.more summary { cursor: pointer; font-weight: 700; color: var(--ai); min-height: 44px; display: flex; align-items: center; }
details.more > div { display: flex; flex-direction: column; gap: 18px; margin-top: 10px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle label { margin: 0; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head><body>

<div class="app" id="app"></div>

<script>
(() => {
'use strict';

// ---------- Lesson data: [english, japanese, example(en), example(ja)] ----------
const LETTER_JA = 'エー ビー シー ディー イー エフ ジー エイチ アイ ジェー ケー エル エム エヌ オー ピー キュー アール エス ティー ユー ヴィー ダブリュー エックス ワイ ズィー'.split(' ');
const LETTER_WORD = [['apple','りんご'],['book','本'],['cat','ねこ'],['dog','犬'],['egg','たまご'],['fish','魚'],['green','緑'],['hat','ぼうし'],['ice','氷'],['juice','ジュース'],['key','かぎ'],['lemon','レモン'],['milk','牛乳'],['name','名前'],['orange','オレンジ'],['pen','ペン'],['queen','女王'],['red','赤'],['sun','太陽'],['tea','お茶'],['umbrella','かさ'],['violin','バイオリン'],['water','水'],['fox','きつね'],['yes','はい'],['zoo','動物園']];

const UNITS = [
  { id: 'abc', ja: 'アルファベット', en: 'The ABCs', kind: 'letter',
    items: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('').map((L, i) => ({
      en: L, ja: LETTER_JA[i], visual: L + ' ' + L.toLowerCase(),
      ex: `${L} is for ${LETTER_WORD[i][0]}.`, exJa: `${LETTER_WORD[i][0]}(${LETTER_WORD[i][1]})の ${L}`,
      say: `${L}.`, sayLong: `${L}. ${L} is for ${LETTER_WORD[i][0]}.`
    })) },
  { id: 'greet', ja: 'あいさつ', en: 'Greetings', items: [
    ['Hello', 'こんにちは', 'Hello, everyone!', 'みなさん、こんにちは!'],
    ['Good morning', 'おはようございます', 'Good morning! How are you?', 'おはよう!元気?'],
    ['Good evening', 'こんばんは'],
    ['Good night', 'おやすみなさい', 'Good night. See you tomorrow.', 'おやすみ。また明日。'],
    ['Thank you', 'ありがとう', 'Thank you very much.', 'どうもありがとうございます。'],
    ["You're welcome", 'どういたしまして'],
    ['Sorry', 'ごめんなさい', "I'm sorry.", 'ごめんなさい。'],
    ['Excuse me', 'すみません', 'Excuse me, where is the station?', 'すみません、駅はどこですか?'],
    ['Goodbye', 'さようなら'],
    ['See you', 'またね', 'See you tomorrow!', 'また明日ね!'],
    ['Yes', 'はい'],
    ['No', 'いいえ'],
    ['Please', 'お願いします', 'Water, please.', 'お水をお願いします。'],
    ['Nice to meet you', 'はじめまして', 'Nice to meet you, too.', 'こちらこそ、はじめまして。'],
  ] },
  { id: 'num', ja: 'かず', en: 'Numbers', items: [
    ['zero', 'ゼロ', null, null, '0'], ['one', 'いち', 'I have one cat.', 'ねこを1ぴき飼っています。', '1'],
    ['two', 'に', null, null, '2'], ['three', 'さん', null, null, '3'], ['four', 'よん', null, null, '4'],
    ['five', 'ご', 'Five apples, please.', 'りんごを5こください。', '5'], ['six', 'ろく', null, null, '6'],
    ['seven', 'なな', null, null, '7'], ['eight', 'はち', null, null, '8'], ['nine', 'きゅう', null, null, '9'],
    ['ten', 'じゅう', 'I sleep at ten.', '10時に寝ます。', '10'],
  ] },
  { id: 'color', ja: 'いろ', en: 'Colors', items: [
    ['red', '赤', 'I like red.', '赤が好きです。', null, '#D23A32'], ['blue', '青', 'The sky is blue.', '空は青い。', null, '#2F6BD6'],
    ['yellow', '黄色', null, null, null, '#F2C230'], ['green', '緑', null, null, null, '#3C9A4A'],
    ['white', '白', null, null, null, '#FFFFFF'], ['black', '黒', null, null, null, '#111111'],
    ['pink', 'ピンク', null, null, null, '#F08DB3'], ['orange', 'オレンジ', null, null, null, '#F08A24'],
    ['purple', 'むらさき', null, null, null, '#7D4AB8'], ['brown', '茶色', null, null, null, '#7A4E2D'],
  ] },
  { id: 'family', ja: 'かぞく', en: 'Family', items: [
    ['family', '家族', 'I love my family.', '家族が大好きです。'],
    ['mother', '母・お母さん', 'My mother lives in Japan.', '母は日本に住んでいます。'],
    ['father', '父・お父さん'],
    ['wife', '妻', 'She is my wife.', '彼女は私の妻です。'],
    ['husband', '夫', 'This is my husband.', 'こちらは私の夫です。'],
    ['sister', '姉・妹'], ['brother', '兄・弟'],
    ['son', '息子'], ['daughter', '娘'], ['baby', '赤ちゃん'],
    ['grandmother', 'おばあちゃん'], ['grandfather', 'おじいちゃん'],
  ] },
  { id: 'food', ja: 'たべもの・のみもの', en: 'Food & Drinks', items: [
    ['rice', 'ごはん・お米', 'I eat rice every day.', '毎日ごはんを食べます。'],
    ['bread', 'パン'], ['water', '水', 'Can I have some water?', 'お水をもらえますか?'],
    ['tea', 'お茶'], ['coffee', 'コーヒー', 'I like coffee.', 'コーヒーが好きです。'],
    ['milk', '牛乳'], ['egg', 'たまご'], ['fish', '魚'], ['meat', '肉'],
    ['apple', 'りんご'], ['banana', 'バナナ'], ['vegetables', '野菜'],
  ] },
  { id: 'verb', ja: 'よく使う動詞', en: 'Everyday verbs', items: [
    ['eat', '食べる', 'I eat breakfast.', '朝ごはんを食べます。'],
    ['drink', '飲む', 'I drink tea.', 'お茶を飲みます。'],
    ['go', '行く', 'I go to work.', '仕事に行きます。'],
    ['come', '来る', 'Come here, please.', 'こっちに来てください。'],
    ['sleep', '寝る'], ['read', '読む', 'I read a book.', '本を読みます。'],
    ['write', '書く', 'I write my name.', '名前を書きます。'],
    ['speak', '話す', 'I speak Japanese.', '日本語を話します。'],
    ['listen', '聞く', 'I listen to music.', '音楽を聞きます。'],
    ['like', '好き', 'I like cats.', 'ねこが好きです。'],
    ['study', '勉強する', 'I study English.', '英語を勉強します。'],
    ['walk', '歩く'],
  ] },
  { id: 'talk', ja: 'かんたん会話', en: 'Simple phrases', phrase: true, items: [
    ['My name is Yuki.', '私の名前はユキです。'],
    ["I'm from Japan.", '日本から来ました。'],
    ['How are you?', '元気ですか?'],
    ["I'm fine, thank you.", '元気です、ありがとう。'],
    ['What is this?', 'これは何ですか?'],
    ['How much is this?', 'これはいくらですか?'],
    ['Where is the toilet?', 'トイレはどこですか?'],
    ["I don't understand.", 'わかりません。'],
    ['Please speak slowly.', 'ゆっくり話してください。'],
    ['One more time, please.', 'もう一度お願いします。'],
    ['Can you help me?', '手伝ってもらえますか?'],
  ] },
];
UNITS.forEach(u => {
  u.items = u.items.map((it, i) => Array.isArray(it)
    ? { en: it[0], ja: it[1], ex: it[2] || null, exJa: it[3] || null, visual: it[4] || null, swatch: it[5] || null, id: u.id + ':' + i }
    : Object.assign(it, { id: u.id + ':' + i }));
});
const ALL = UNITS.flatMap(u => u.items.map(it => Object.assign(it, { unit: u })));
const LEARNED_BOX = 1;   // "覚えた!" once (or one right quiz answer) counts; a wrong answer resets it.

// ---------- Saved progress (this browser only) ----------
const KEY = 'english-benkyou-v1';
const fresh = () => ({ cards: {}, streak: { count: 0, day: null }, settings: { rate: 0.8, voice: '', size: 'l', auto: true }, seenGuide: false, hideInstall: false });
let S = fresh();
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(fresh(), JSON.parse(raw)); } catch (e) {}
// People who already studied before this guide existed don't need it forced on them.
if (!S.seenGuide && Object.keys(S.cards).length) S.seenGuide = true;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} };
const box = id => (S.cards[id] && S.cards[id].box) || 0;
const setBox = (id, b) => { S.cards[id] = { box: Math.max(0, Math.min(3, b)), t: Date.now() }; touchStreak(); save(); };
const dayStr = d => d.toISOString().slice(0, 10);
function touchStreak() {
  const today = dayStr(new Date()), yest = dayStr(new Date(Date.now() - 864e5));
  if (S.streak.day === today) return;
  S.streak.count = S.streak.day === yest ? S.streak.count + 1 : 1;
  S.streak.day = today;
}
const streakNow = () => {
  const today = dayStr(new Date()), yest = dayStr(new Date(Date.now() - 864e5));
  return (S.streak.day === today || S.streak.day === yest) ? S.streak.count : 0;
};
const learnedIn = u => u.items.filter(it => box(it.id) >= LEARNED_BOX).length;

// ---------- Speech (browser text-to-speech) ----------
const synth = window.speechSynthesis;
let voices = [];
function loadVoices() { if (synth) voices = synth.getVoices().filter(v => /^en[-_]/i.test(v.lang)); }
loadVoices(); if (synth) synth.onvoiceschanged = () => { loadVoices(); if (view.name === 'settings') render(); };
function pickVoice() {
  return voices.find(v => v.voiceURI === S.settings.voice)
    || voices.find(v => /en[-_]US/i.test(v.lang) && /google|samantha|natural|aria|jenny/i.test(v.name))
    || voices.find(v => /en[-_]US/i.test(v.lang)) || voices[0] || null;
}
function speak(text, rate) {
  if (!synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const v = pickVoice(); if (v) u.voice = v;
  u.lang = v ? v.lang : 'en-US';
  u.rate = rate || S.settings.rate;
  synth.speak(u);
}
const sayOf = it => it.say || it.en;

// ---------- Tiny view system ----------
const $app = document.getElementById('app');
let view = { name: 'home' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const SPEAKER = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>';
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

// Environment checks used for beginner help (sound, home-screen install, in-app browsers).
const UA = navigator.userAgent;
const isIOS = /iPhone|iPad|iPod/.test(UA) || (/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const inAppBrowser = /\bLine\/|FBAN|FBAV|Instagram|; wv\)/i.test(UA);
const isStandalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let installPrompt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installPrompt = e; if (view.name === 'home' || view.name === 'help') render(); });
window.addEventListener('appinstalled', () => { installPrompt = null; S.hideInstall = true; save(); if (view.name === 'home') render(); });

function applySize() { document.documentElement.dataset.size = S.settings.size || 'l'; }
applySize();

// The phone's own Back button returns to Home instead of closing the app:
// leaving Home pushes one history entry; any Back press lands on popstate.
function go(v) {
  const wasHome = view.name === 'home';
  view = v;
  if (v.name !== 'home' && wasHome) history.pushState({ eb: 1 }, '');
  render(); window.scrollTo(0, 0);
}
function goHome() {
  if (synth) synth.cancel();
  if (history.state && history.state.eb) history.back();   // popstate renders Home
  else { view = { name: 'home' }; render(); window.scrollTo(0, 0); }
}
const quizInProgress = () => view.name === 'quiz' && (view.i > 0 || view.answered) && !view.confirmQuit;
window.addEventListener('popstate', () => {
  if (quizInProgress()) {                       // Back in the middle of a quiz: ask first
    history.pushState({ eb: 1 }, ''); view.confirmQuit = true; render(); return;
  }
  if (synth) synth.cancel();
  view = { name: 'home' }; render(); window.scrollTo(0, 0);
});

function render() {
  if (view.name === 'home') return renderHome();
  if (view.name === 'cards') return renderCard();
  if (view.name === 'quiz') return renderQuiz();
  if (view.name === 'result') return renderResult();
  if (view.name === 'settings') return renderSettings();
  if (view.name === 'help') return renderHelp();
}

const GEAR = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>';

// ---------- Flashcards ----------
function startCards(unitId) {
  const u = UNITS.find(x => x.id === unitId);
  // Unlearned cards first, lowest box first; then the rest.
  const order = shuffle(u.items).sort((a, b) => box(a.id) - box(b.id));
  go({ name: 'cards', unit: u, queue: order, done: 0, total: order.length, flipped: false, spoken: false });
}
function renderCard() {
  const v = view, it = v.queue[0];
  if (!it) { $app.innerHTML = `<div class="viewhead">${backBtn()}</div><div class="result"><div class="score">✓</div><h1>${esc(v.unit.ja)}のカード、おわり!</h1>
      <p class="hint">${learnedIn(v.unit)} / ${v.unit.items.length} 覚えました。つぎはクイズでたしかめよう。</p>
      <div class="row" style="width:100%"><button class="btn big ghost" data-act="home">ホームへ</button><button class="btn big" data-act="quiz" data-unit="${v.unit.id}">クイズへ</button></div></div>`; return; }
  const front = `
      ${it.visual && v.unit.kind !== 'letter' ? `<div class="visual">${esc(it.visual)}</div>` : ''}
      ${it.swatch ? `<div class="swatch" style="background:${it.swatch}"></div>` : ''}
      <div class="word en${v.unit.phrase ? ' phrase' : ''}">${esc(v.unit.kind === 'letter' ? it.visual : it.en)}</div>`;
  const back = `<div class="meaning">${esc(it.ja)}</div>
      ${it.ex ? `<div class="ex"><span class="en">${esc(it.ex)}</span>${esc(it.exJa || '')}</div>` : ''}`;
  $app.innerHTML = `
    <div class="viewhead">${backBtn()}<strong>${esc(v.unit.ja)}</strong><span class="prog">${v.done + 1} / ${v.total} まい</span></div>
    <button class="card" data-act="flip" aria-label="${v.flipped ? 'カード' : 'こたえを見る'}">${front}${v.flipped ? back : '<div class="tap">意味を思い出してみよう</div>'}</button>
    <div class="speakrow">
      <button class="speak" data-act="say">${SPEAKER}<span>きく</span></button>
      <button class="speak" data-act="say-slow">${SPEAKER}<span>ゆっくり</span></button>
      ${it.ex || it.sayLong ? `<button class="speak" data-act="say-ex">${SPEAKER}<span>例文</span></button>` : ''}
    </div>
    ${v.flipped
      ? `<div class="row"><button class="btn big again" data-act="again">もう一回</button><button class="btn big know" data-act="know">覚えた!</button></div>
         <p class="hint" style="text-align:center">自信がなければ「もう一回」。少しあとで、また出てきます。</p>`
      : `<button class="btn big reveal" data-act="flip">こたえを見る</button>`}
    <button class="linkbtn" data-act="help" style="align-self:center">音が出ないときは</button>`;
  if (!v.spoken && S.settings.auto !== false) { v.spoken = true; speak(sayOf(it)); }
}
function cardAnswer(known) {
  const v = view, it = v.queue.shift();
  if (known) { setBox(it.id, box(it.id) + 1); v.done++; }
  else { setBox(it.id, 0); v.queue.splice(Math.min(3, v.queue.length), 0, it); }
  v.flipped = false; v.spoken = false; render(); window.scrollTo(0, 0);
}

// ---------- Quiz ----------
function startQuiz(unitId) {
  const u = UNITS.find(x => x.id === unitId);
  const pool = shuffle(u.items).sort((a, b) => box(a.id) - box(b.id)).slice(0, 10);
  const kinds = synth ? ['en2ja', 'ja2en', 'listen'] : ['en2ja', 'ja2en'];
  const qs = shuffle(pool).map((it, i) => {
    const kind = kinds[i % kinds.length];
    const others = shuffle(u.items.filter(x => x !== it && x.ja !== it.ja)).slice(0, 3);
    return { it, kind, opts: shuffle([it, ...others]) };
  });
  go({ name: 'quiz', unit: u, qs, i: 0, right: 0, misses: [], answered: null });
}
function renderQuiz() {
  const v = view, q = v.qs[v.i], it = q.it, letter = v.unit.kind === 'letter';
  const label = { en2ja: 'この英語の意味は、どれ?', ja2en: '英語で、なんと言う?', listen: '音を聞いて、えらんでね' }[q.kind];
  const prompt = q.kind === 'en2ja' ? `<div class="prompt en">${esc(letter ? it.visual : it.en)}</div>`
    : q.kind === 'ja2en' ? `<div class="prompt">${esc(it.ja)}</div>`
    : `<button class="speak" data-act="say" style="font-size:18px;padding:12px 22px">${SPEAKER}<span>もう一度きく</span></button>`;
  const showEn = q.kind !== 'en2ja';
  const long = q.opts.some(o => (showEn ? o.en : o.ja).length > 12);
  const a = v.answered;
  $app.innerHTML = `
    <div class="viewhead"><button class="back" data-act="quit">← やめる</button><strong>${esc(v.unit.ja)} クイズ</strong><span class="prog">${v.i + 1} / ${v.qs.length} もん</span></div>
    ${v.confirmQuit ? `<div class="confirm" role="alertdialog" aria-label="クイズをやめますか"><p>クイズをやめて、ホームにもどりますか?</p>
      <div class="row"><button class="btn big ghost" data-act="quit-no">つづける</button><button class="btn big again" data-act="quit-yes">やめる</button></div></div>` : ''}
    <div class="q"><div class="kind">${label}</div>${prompt}</div>
    <div class="opts${long ? ' long' : ''}">${q.opts.map((o, k) => {
      let cls = 'opt' + (showEn ? ' en' : '');
      if (a) { if (o === it) cls += ' right'; else if (k === a.pick) cls += ' wrong'; }
      return `<button class="${cls}" data-act="pick" data-k="${k}" ${a ? 'disabled' : ''}>${esc(showEn ? (letter ? o.visual : o.en) : o.ja)}</button>`;
    }).join('')}</div>
    <div class="feedback ${a ? (a.ok ? 'ok' : 'ng') : ''}" aria-live="polite">${a ? (a.ok
      ? '<span class="mark">○</span>せいかい!'
      : `<span class="mark">✕</span>ざんねん… こたえは「${esc(it.en)} = ${esc(it.ja)}」`) : ''}</div>
    ${a ? `<div class="row"><button class="btn big" data-act="next">${v.i + 1 < v.qs.length ? 'つぎの問題へ →' : 'けっかを見る →'}</button></div>` : ''}`;
  if (q.kind === 'listen' && !a && !v.spoken) { v.spoken = true; speak(sayOf(it)); }
}
function pick(k) {
  const v = view, q = v.qs[v.i]; if (v.answered) return;
  const ok = q.opts[k] === q.it;
  v.answered = { pick: k, ok };
  if (ok) { v.right++; setBox(q.it.id, box(q.it.id) + 1); } else { v.misses.push(q.it); setBox(q.it.id, 0); }
  if (navigator.vibrate && !ok) { try { navigator.vibrate(80); } catch (e) {} }
  speak(sayOf(q.it)); render();
  const nb = document.querySelector('[data-act="next"]'); if (nb && nb.scrollIntoView) nb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
}
function nextQ() {
  const v = view; v.answered = null; v.spoken = false;
  if (++v.i >= v.qs.length) { view = { name: 'result', unit: v.unit, right: v.right, total: v.qs.length, misses: v.misses }; render(); }
  else render();
  window.scrollTo(0, 0);
}
function renderResult() {
  const v = view, pct = v.right / v.total;
  const msg = pct === 1 ? 'パーフェクト!すごい!' : pct >= 0.7 ? 'よくできました!' : 'だいじょうぶ、くりかえせば覚えられるよ。';
  $app.innerHTML = `<div class="viewhead">${backBtn()}</div><div class="result">
    <div class="hint">${esc(v.unit.ja)} クイズ</div>
    <div class="score">${v.right}<span style="font-size:24px;color:var(--muted)"> / ${v.total}</span></div>
    <h1>${msg}</h1>
    ${v.misses.length ? `<div class="misses"><h2>まちがえたことば</h2>${v.misses.map(m => `<div><span class="en">${esc(m.en)}</span><span>${esc(m.ja)}</span></div>`).join('')}</div>` : ''}
    <div class="row" style="width:100%"><button class="btn big ghost" data-act="cards" data-unit="${v.unit.id}">カードで復習</button><button class="btn big" data-act="quiz" data-unit="${v.unit.id}">もう一度</button></div>
    <button class="btn big ghost" style="width:100%" data-act="home">ホームへもどる</button></div>`;
}

    <div class="settings">
      <div><label>文字の大きさ</label><div class="seg">${sizeButtons()}</div></div>
      <div><label>読み上げの速さ</label><div class="seg">${rates.map(([r, l]) => `<button data-act="rate" data-r="${r}" aria-pressed="${S.settings.rate === r}">${l}</button>`).join('')}</div></div>
      <div><label>カードを出したとき、自動で読み上げる</label><div class="seg">
        <button data-act="auto" data-on="1" aria-pressed="${S.settings.auto !== false}">する</button>
        <button data-act="auto" data-on="0" aria-pressed="${S.settings.auto === false}">しない</button></div></div>
      <div class="row"><button class="speak" data-act="test">${SPEAKER}<span>ためしに聞く</span></button></div>
      <details class="more"><summary>くわしい設定</summary><div>
        <div><label for="voice">声のしゅるい</label>${voices.length ? `<select id="voice">${voices.map(v => `<option value="${esc(v.voiceURI)}" ${cur && cur.voiceURI === v.voiceURI ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('')}</select>` : '<p class="hint">英語の声が見つかりません。</p>'}</div>
        <div><label>きろくを消す</label>
          ${view.confirmReset ? `<p class="hint">覚えたことばと連続日数がぜんぶ消えます。元にはもどせません。いいですか?</p><div class="row"><button class="danger" data-act="reset-yes">消す</button><button class="btn ghost" data-act="reset-no">やめる</button></div>`
            : `<button class="danger" data-act="reset">きろくを消す</button>`}</div>
      </div></details>
      <p class="hint">きろくはこのスマホ(パソコン)のブラウザに、自動で保存されます。</p>
    </div>`;
  const sel = document.getElementById('voice');
  if (sel) sel.onchange = () => { S.settings.voice = sel.value; save(); speak('Hello! Nice to meet you.'); };
  if (view.confirmReset) { const d = $app.querySelector('details.more'); if (d) d.open = true; }
}

// ---------- Events ----------
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, v = view;
  switch (act) {
    case 'home': goHome(); break;
    case 'settings': go({ name: 'settings' }); break;
    case 'help': go({ name: 'help' }); break;
    case 'guide-done': S.seenGuide = true; save(); goHome(); break;
    case 'cards': startCards(b.dataset.unit); break;
    case 'quiz': startQuiz(b.dataset.unit); break;
    case 'flip': v.flipped = !v.flipped; render(); break;
    case 'say': speak(v.name === 'quiz' ? sayOf(v.qs[v.i].it) : sayOf(v.queue[0])); break;
    case 'say-slow': speak(sayOf(v.queue[0]), 0.5); break;
    case 'say-ex': { const it = v.queue[0]; speak(it.sayLong || it.ex); break; }
    case 'again': cardAnswer(false); break;
    case 'know': cardAnswer(true); break;
    case 'pick': pick(+b.dataset.k); break;
    case 'next': nextQ(); break;
    case 'quit': if (quizInProgress()) { v.confirmQuit = true; render(); window.scrollTo(0, 0); } else goHome(); break;
    case 'quit-no': v.confirmQuit = false; render(); break;
    case 'quit-yes': goHome(); break;
    case 'size': S.settings.size = b.dataset.s; save(); applySize(); render(); break;
    case 'auto': S.settings.auto = b.dataset.on === '1'; save(); render(); break;
    case 'rate': S.settings.rate = +b.dataset.r; save(); render(); speak('This is the speed.'); break;
    case 'test': speak('Hello! Nice to meet you.'); break;
    case 'install': if (installPrompt) { const p = installPrompt; installPrompt = null; p.prompt(); p.userChoice.finally(render); } break;
    case 'hide-install': S.hideInstall = true; save(); render(); break;
    case 'reset': v.confirmReset = true; render(); break;
    case 'reset-no': v.confirmReset = false; render(); break;
    case 'reset-yes': { const keep = { size: S.settings.size }; S = fresh(); S.seenGuide = true; Object.assign(S.settings, keep); save(); goHome(); break; }
  }
});

render();
if ('serviceWorker' in navigator && location.protocol === 'https:' && !/claude\.ai|claudeusercontent/.test(location.host)) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
})();
</script>
</body></html>
